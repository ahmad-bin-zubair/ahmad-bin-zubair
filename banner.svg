<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ahmad Zubair, IT System and Network Administrator: I keep networks up and turn manual IT work into automation">
  <style>
    .t{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
    .mono{font-family:Consolas,'JetBrains Mono',monospace}
    .fade{opacity:0;animation:in 1s ease forwards}
    .d1{animation-delay:.2s}.d2{animation-delay:.7s}.d3{animation-delay:1.2s}.d4{animation-delay:1.7s}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .flow{stroke-dasharray:6 10;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-32}}
    @media (prefers-reduced-motion:reduce){.fade{animation:none;opacity:1}.pulse,.flow{animation:none}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070d1f"/><stop offset="1" stop-color="#101b3d"/></linearGradient>
    <radialGradient id="glow" cx="1000" cy="40" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset=".55" stop-color="#fb923c"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
    <linearGradient id="mk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <g class="t">
    <g class="fade d1">
      <rect x="48" y="44" width="46" height="46" rx="12" fill="url(#mk)"/>
      <text x="71" y="74" text-anchor="middle" font-size="18" font-weight="900" fill="#04211e">AZ</text>
      <text x="108" y="75" font-size="24" font-weight="800" fill="#e8edf8">Ahmad Zubair</text>
    </g>
    <text class="fade d2" x="48" y="146" font-size="40" font-weight="900" fill="#ffffff">I keep networks up and turn</text>
    <text class="fade d3" x="48" y="196" font-size="40" font-weight="900" fill="url(#hl)">manual IT work into automation.</text>
    <text class="fade d4" x="50" y="240" font-size="19" fill="#93a1c3">IT System &amp; Network Administrator · Lahore, Pakistan</text>
  </g>

  <!-- small live network on the right -->
  <g class="fade d3">
    <g stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path class="flow" d="M830 110 L960 150"/><path class="flow" d="M830 190 L960 150"/>
      <path class="flow" d="M1010 150 L1120 100"/><path class="flow" d="M1010 150 L1120 150"/><path class="flow" d="M1010 150 L1120 200"/>
    </g>
    <g class="t" text-anchor="middle" font-size="12" font-weight="700" fill="#e8edf8">
      <rect x="770" y="92" width="64" height="36" rx="9" fill="#13203f" stroke="#fbbf24"/><text x="802" y="115">ISP</text>
      <rect x="770" y="172" width="64" height="36" rx="9" fill="#13203f" stroke="#fbbf24"/><text x="802" y="195">ISP</text>
      <rect x="950" y="126" width="64" height="48" rx="11" fill="url(#mk)"/><text x="982" y="155" fill="#04211e">NOC</text>
      <rect x="1116" y="84" width="58" height="32" rx="9" fill="#13203f" stroke="#34d399"/><text x="1145" y="105">SW</text>
      <rect x="1116" y="134" width="58" height="32" rx="9" fill="#13203f" stroke="#34d399"/><text x="1145" y="155">AP</text>
      <rect x="1116" y="184" width="58" height="32" rx="9" fill="#13203f" stroke="#34d399"/><text x="1145" y="205">SRV</text>
    </g>
    <circle class="pulse" cx="1014" cy="130" r="5" fill="#34d399"/>
  </g>
</svg>
